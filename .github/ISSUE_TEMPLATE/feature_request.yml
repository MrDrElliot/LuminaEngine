name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what makes it hard or impossible today.
      placeholder: When I build a level with many prefabs, I have to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Sketches, mockups or example code are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Renderer
        - ECS and systems
        - Physics
        - Animation
        - Audio
        - Navigation and AI
        - C# scripting (LuminaSharp)
        - UI (RmlUi)
        - Assets and importing
        - Networking
        - Build and tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use today, or how other engines handle it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
