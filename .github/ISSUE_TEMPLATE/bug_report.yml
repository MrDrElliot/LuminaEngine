name: Bug report
description: Something in the engine or editor does not work the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A clear report with steps we can follow gets fixed much faster.
        If the engine or a project fails to compile or generate, use the **Build failure** template instead.

  - type: input
    id: version
    attributes:
      label: Engine version
      description: The version from LUMINA_VERSION_MAJOR, MINOR and PATCH in Engine/Source/Runtime/Source/Lumina.h, or the commit hash you built from.
      placeholder: 0.1.168 (or a commit hash)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: Most rendering bugs depend on the GPU. Include the driver version.
      placeholder: NVIDIA RTX 4070, driver 581.15

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in the engine the problem shows up. Pick the closest one.
      options:
        - Editor
        - Renderer
        - ECS and systems
        - Physics
        - Animation
        - Audio
        - Navigation and AI
        - C# scripting (LuminaSharp)
        - UI (RmlUi)
        - Assets and importing
        - Networking
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that make the bug happen, starting from opening the editor or a project.
      placeholder: |
        1. Open the Blank template project
        2. Add an entity with a Static Mesh component
        3. Set its rotation Y to 179 in the details panel
        4. See the rotation flip back and forth
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of Lumina.log from your project's Logs folder, or the error and call stack for a crash. This is formatted as code automatically.
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, videos or files
      description: Drag in screenshots, a short video, a crash dump, or a small project that shows the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: I can still reproduce this on the latest dev branch.
